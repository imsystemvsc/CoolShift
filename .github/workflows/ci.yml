name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CoolShift.sln

      - name: Build
        run: dotnet build CoolShift.sln -c Release --no-restore

      - name: Test
        run: dotnet test CoolShift.sln -c Release --no-build --no-restore
